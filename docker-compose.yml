services:
  db:
    image: postgis/postgis:16-3.4
    container_name: urbanflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbanflow
      POSTGRES_USER: urbanflow
      POSTGRES_PASSWORD: urbanflow__GiovaniT6_2026!!!!!!
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanflow -d urbanflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
